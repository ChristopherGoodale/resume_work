<!doctype html>
<html>
<head><title>Password guard fixture</title></head>
<body>
  <form>
    <label for="email">Email</label>
    <input id="email" name="email" type="text" />

    <label for="account_password">Create a password</label>
    <input id="account_password" name="account_password" type="password" />

    <label for="confirm_password">Confirm password</label>
    <input id="confirm_password" type="text" aria-label="Confirm Password" />
  </form>
</body>
</html>
