<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Christopher Goodale — Resume</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #e8e8e6;
    --text: #1c1c1c;
    --muted: #6b6b6b;
    --accent: #2f5d50;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111214;
      --text: #edeceb;
      --muted: #9a9a9a;
      --accent: #7fb9a6;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 3rem;
  }
  .top {
    width: 100%;
    max-width: 850px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  .top h1 { font-size: 1.1rem; margin: 0; font-weight: 600; }
  .top a {
    color: var(--accent);
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 500;
  }
  .pages {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2rem;
    width: 100%;
  }
  .page {
    background: #fff;
    box-shadow: 0 4px 18px rgba(0,0,0,0.18);
    max-width: 100%;
  }
  .page canvas {
    display: block;
    width: 100%;
    height: auto;
  }
  .status {
    color: var(--muted);
    font-size: 0.9rem;
    padding: 3rem 0;
  }
</style>
</head>
<body>
  <div class="top">
    <h1>Christopher Goodale</h1>
    <a href="resume.pdf" download>Download PDF</a>
  </div>
  <div class="pages" id="pages">
    <p class="status">Loading resume…</p>
  </div>

  <script type="module">
    import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.min.mjs';

    const container = document.getElementById('pages');
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.worker.min.mjs';

    pdfjsLib.getDocument('resume.pdf').promise.then(async (pdf) => {
      container.innerHTML = '';
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const scale = 2; // render at 2x for crisp text, scaled down via CSS
        const viewport = page.getViewport({ scale });

        const wrapper = document.createElement('div');
        wrapper.className = 'page';
        wrapper.style.width = (viewport.width / scale) + 'px';

        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        wrapper.appendChild(canvas);
        container.appendChild(wrapper);

        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
      }
    }).catch((err) => {
      container.innerHTML =
        '<p class="status">Couldn\'t render the resume inline. <a href="resume.pdf">Open the PDF directly</a>.</p>';
      console.error(err);
    });
  </script>
</body>
</html>
